# pyproject.toml -- conciliab (exemplo saas-python-regulado)
# Stack: Python 3.12 + Poetry 1.8 + FastAPI + SQLAlchemy + Alembic + Celery + Pytest + Ruff + Mypy + Hypothesis
# Politica de dependencias: docs/seguranca/dependency-policy.md
# Convencoes de codigo: docs/CONVENCOES-DOC.md (fora deste exemplo) + AGENTS.md secao 8

[tool.poetry]
name = "conciliab"
version = "2026.5.3"
description = "SaaS B2B multi-tenant que automatiza conciliacao bancaria para PMEs brasileiras"
authors = ["Conciliab Tecnologia Ltda. <contato@conciliab.com.br>"]
license = "Proprietary"
readme = "README.md"
homepage = "https://conciliab.com.br"
repository = "https://github.com/conciliab/conciliab-api"
packages = [{ include = "conciliab" }]

[tool.poetry.dependencies]
python = "^3.12"
# --- HTTP / API ---
fastapi = "0.110.0"
uvicorn = { extras = ["standard"], version = "0.27.1" }
pydantic = "2.6.3"
pydantic-settings = "2.2.1"
# --- Banco / ORM / migrations ---
sqlalchemy = "2.0.28"
alembic = "1.13.1"
psycopg = { extras = ["binary"], version = "3.1.18" }
# --- Fila / cache ---
celery = "5.3.6"
redis = "5.0.2"
# --- AWS (S3, Secrets Manager, Cognito) ---
boto3 = "1.34.51"
# --- Auth / crypto (PINNED EXATAS, ver dependency-policy.md secao 3) ---
pyjwt = { extras = ["crypto"], version = "==2.9.0" }
cryptography = "==42.0.4"
# --- Observabilidade ---
structlog = "24.1.0"
opentelemetry-instrumentation-fastapi = "0.45b0"
opentelemetry-instrumentation-sqlalchemy = "0.45b0"
opentelemetry-instrumentation-celery = "0.45b0"
datadog = "0.49.1"
# --- Utilidades ---
python-dateutil = "2.9.0"
httpx = "0.27.0"

[tool.poetry.group.dev.dependencies]
# --- Testes ---
pytest = "8.0.2"
pytest-asyncio = "0.23.5"
pytest-cov = "4.1.0"
pytest-benchmark = "4.0.0"
hypothesis = "6.99.4"
faker = "24.0.0"
# --- Lint / types / format ---
ruff = "0.3.0"
mypy = "1.8.0"
types-python-dateutil = "2.9.0.20240315"
# --- Gates / governanca ---
pre-commit = "3.6.2"
# --- Seguranca / SBOM ---
pip-audit = "2.7.2"
cyclonedx-bom = "4.1.1"
# --- Performance ---
locust = "2.24.0"

[tool.poetry.group.docs.dependencies]
mkdocs = "1.5.3"
mkdocs-material = "9.5.13"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

# =============================================================================
# Ruff (lint + format) -- AGENTS.md secao 8
# =============================================================================
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations/versions", "tests/load/fixtures"]

[tool.ruff.lint]
# Regras explicitas conforme AGENTS.md secao 8: E,F,I,N,UP,B,A,C4,DTZ,T20,SIM,RUF
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez (forca timezone aware - critico em multi-tenant BR)
    "T20", # flake8-print (proibe print em prod - INV-AGENT-008)
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "S",   # flake8-bandit (seguranca basica)
]
ignore = [
    "E501",  # line too long (formatter cuida)
    "S101",  # use of assert (permitido em tests/)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "T20"]
"migrations/versions/*.py" = ["E", "F", "I", "N"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint.isort]
known-first-party = ["conciliab"]

# =============================================================================
# Mypy -- AGENTS.md secao 8: strict em modulos novos
# =============================================================================
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
plugins = ["pydantic.mypy"]
exclude = [
    "migrations/versions/",
    "tests/load/fixtures/",
]

[[tool.mypy.overrides]]
# Modulos legados sem strict ainda (T-MIGR-001 planejado)
module = ["conciliab.legacy.*"]
strict = false
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# Bibliotecas sem stubs
module = ["celery.*", "datadog.*", "locust.*"]
ignore_missing_imports = true

# =============================================================================
# Pytest
# =============================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=conciliab",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=80",
]
markers = [
    "unit: unit tests (rapidos, isolados)",
    "integration: testes contra Postgres + Redis local via docker-compose",
    "isolation: testes de isolamento multi-tenant (RLS) - INV-TENANT-*",
    "lgpd: testes de conformidade LGPD - INV-LGPD-*",
    "slow: testes que demoram > 5s",
]
asyncio_mode = "auto"
# Filtros: warnings de deps externas nao quebram suite, mas deprecation interna quebra
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:celery.*",
    "ignore::DeprecationWarning:botocore.*",
]

[tool.coverage.run]
branch = true
source = ["conciliab"]
omit = [
    "conciliab/main.py",
    "conciliab/scripts/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false

# =============================================================================
# Hypothesis (property-based testing - INV-AGENT-006)
# =============================================================================
[tool.hypothesis]
deadline = 1000  # ms
max_examples = 100
derandomize = false
print_blob = true  # facilita reproducao de falhas

# =============================================================================
# Scripts canonicos -- ver AGENTS.md secao 6
# =============================================================================
[tool.poetry.scripts]
seed-dev = "conciliab.scripts.seed_dev:main"
anonimizar-prod = "conciliab.scripts.anonimizar:main"
